<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Q4Quiz1</title>
  <style>
    .container {
      background-color: white;
      box-shadow: 4px 4px 20px rgba(0, 0, 0, 0.8);
    }
    body {
      background-color: skyblue;
    }
    img{
      width: 500px;
      height: 500px;
    }
  </style>
</head>
<body>

<br>
<br>
<br>
<br>

<div class="container">
  <div class="row align-items-center">
    
    <div class="col-md-6">
      <h1>BMI Scale</h1>
      <p>Put your weight in kilograms</p>
      <input type="text" class="form-control" id="weight">
      <br>
      <h1>Height in meters</h1>
      <input type="text" class="form-control" id="height">
      <br>
      <button type="submit" class="btn btn-warning" onclick="body1()">Show me</button>
      <br><br>
      <kbd id="BMI">Result</kbd>
    </div>

  
    <div class="col-md-6 text-center">
      <img src="https://www.tataaia.com/content/dam/tataaialifeinsurancecompanylimited/calculator/life-planning-tools/bmi-calculator/banner-image-bmi.png">
    </div>

  </div>
</div>

<script>
  function body1() {
    var weight = document.getElementById("weight").value;
    var height = document.getElementById("height").value;
    var BMI = weight / (height ** 2);
 

    if (BMI <= 24.9 && BMI >= 18.5) {
      you = "Normal weight";
    } else if (BMI < 18.5) {
      you = "Underweight";
    } else if (BMI <= 29.9 && BMI >= 25) {
      you = "Overweight";
    } else if (BMI >= 29.9 && BMI <=39.9) {
      you = "Obese";
    } else {
      you = "Morbidly Obese"
    }

    document.getElementById("BMI").textContent = "You are " + you + " (BMI: " + BMI.toFixed(2) + ")";
  }
</script>

</body>
</html>
